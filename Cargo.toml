[package]
name = "simon_says"
version = "0.1.0"
edition = "2024"

# No `libtest` exists for thumbv7em-none-eabi, so opt this binary out of the
# test and bench harnesses. Without this, `cargo check --all-targets` (which is
# what rust-analyzer runs on save) fails with E0463 "can't find crate for `test`".
[[bin]]
name = "simon_says"
test = false
bench = false

[dependencies]

defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"

embassy-nrf = { version = "0.11.0", features = ["defmt", "nrf52840", "time-driver-rtc1", "gpiote", "time"] }
embassy-futures = { version = "0.1.2" }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }

rand = { version = "0.10.2", default-features = false }
static_cell = "2"
